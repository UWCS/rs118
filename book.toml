[book]
authors = ["Joey Harrison <joeyh021@icloud.com>"]
language = "en"
src = "src"
title = "RS118: UWCS Learns Rust"

[preprocessor.katex]

[output.html]
git-repository-url = "https://github.com/uwcs/rs118"
preferred-dark-theme = "coal"
sidebar-header-nav = false

[output.html.fold]
enable = true

[output.html.playground]
editable = true
line-numbers = true

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
marker = "[[TOC]]"
max-level = 2
